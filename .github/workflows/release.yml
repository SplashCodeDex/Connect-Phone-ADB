name: Build and Release MSIX

on:
  push:
    branches:
      - master
    paths:
      - 'MSIX_Source/AppxManifest.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      minor_bumped: ${{ steps.check.outputs.minor_bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check Minor Version Bump
        id: check
        shell: bash
        run: |
          curr=$(grep -oP 'Version="\K[^"]+' MSIX_Source/AppxManifest.xml || echo "0.0.0.0")
          prev=$(git show HEAD~1:MSIX_Source/AppxManifest.xml | grep -oP 'Version="\K[^"]+' || echo "0.0.0.0")
          curr_minor=$(echo "$curr" | cut -d'.' -f2)
          prev_minor=$(echo "$prev" | cut -d'.' -f2)
          if [ "$curr_minor" -gt "$prev_minor" ]; then
            echo "minor_bumped=true" >> $GITHUB_OUTPUT
          else
            echo "minor_bumped=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.minor_bumped == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true
          
      - name: Build C# Transfer Engine
        run: dotnet build DeXShareTarget --configuration Release

      - name: Pack MSIX
        run: powershell -ExecutionPolicy Bypass -File PackMSIX.ps1
        
      - name: Generate Cert and Sign
        run: powershell -ExecutionPolicy Bypass -File SignMSIX.ps1

      - name: Extract Release Notes from CHANGELOG
        shell: powershell
        run: |
          $content = Get-Content CHANGELOG.md -Raw
          $regex = '(?sm)^(## \[[^\]]+\][^\n]*\n+.*?)(?=\n^## |\z)'
          if ($content -match $regex) {
              $Matches[1].Trim() | Out-File -FilePath RELEASE_NOTES.md -Encoding utf8
          } else {
              "See CHANGELOG.md for details." | Out-File -FilePath RELEASE_NOTES.md -Encoding utf8
          }

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          name: Release ${{ github.ref_name }}
          files: |
            DeX.msix
            CodeDeX.cer
            Install-App.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
