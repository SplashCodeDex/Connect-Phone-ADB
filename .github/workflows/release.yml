name: Build and Release MSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true
          
      - name: Build C# Transfer Engine
        run: dotnet build ConnectPhoneShareTarget --configuration Release

      - name: Pack MSIX
        run: powershell -ExecutionPolicy Bypass -File PackMSIX.ps1
        
      - name: Generate Cert and Sign
        run: powershell -ExecutionPolicy Bypass -File SignMSIX.ps1

      - name: Extract Release Notes from CHANGELOG
        shell: powershell
        run: |
          $content = Get-Content CHANGELOG.md -Raw
          $regex = '(?sm)^(## \[[^\]]+\][^\n]*\n+.*?)(?=\n^## |\z)'
          if ($content -match $regex) {
              $Matches[1].Trim() | Out-File -FilePath RELEASE_NOTES.md -Encoding utf8
          } else {
              "See CHANGELOG.md for details." | Out-File -FilePath RELEASE_NOTES.md -Encoding utf8
          }

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          name: Release ${{ github.ref_name }}
          files: |
            ConnectPhoneADB.msix
            CodeDeX.cer
            Install-App.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
