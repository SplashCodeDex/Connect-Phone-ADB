name: Build and Release MSIX

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Build C# Proxy
        run: dotnet build ConnectPhoneShareTarget --configuration Release

      - name: Pack MSIX
        run: powershell -ExecutionPolicy Bypass -File PackMSIX.ps1
        
      - name: Generate Cert and Sign
        run: powershell -ExecutionPolicy Bypass -File SignMSIX.ps1

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ConnectPhoneADB.msix
            CodeDeX.cer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
