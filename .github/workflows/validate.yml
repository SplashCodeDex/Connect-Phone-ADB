name: Validate Build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight validation (PS syntax, engine XAML load, themes, FindName/resources, assets, manifest)
        shell: powershell
        run: .\Validate-Build.ps1
